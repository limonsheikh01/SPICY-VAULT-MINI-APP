name: Deploy OnClicka Reward Function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/onclicka-reward/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-onclicka-reward.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy onclicka-reward --project-ref bqienkfpdwhemomqnorx
