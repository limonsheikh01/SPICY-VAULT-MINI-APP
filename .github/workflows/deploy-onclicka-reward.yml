name: Deploy OnClicka Reward Function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/onclicka-reward/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-onclicka-reward.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check Supabase access token is available
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions did not receive SUPABASE_ACCESS_TOKEN. Re-save it under Repository secrets (not Environment secrets) with the exact name SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          echo "Supabase access token is available (value hidden)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        run: supabase functions deploy onclicka-reward --project-ref bqienkfpdwhemomqnorx
