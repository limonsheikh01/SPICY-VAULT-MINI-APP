<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPICY VAULT Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#eee;font-family:system-ui;padding:20px}main{max-width:800px;margin:auto}h1{color:#e8a44a}section,.video{background:#171720;border:1px solid #30303b;border-radius:12px;padding:16px;margin:12px 0}input,select,button{width:100%;margin:7px 0;padding:12px;border-radius:8px;border:1px solid #3b3b45;background:#101016;color:white}button{background:#c27b25;border:0;font-weight:bold;cursor:pointer}.secondary{background:#353540}.status{color:#f1bf73;white-space:pre-wrap}.video{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.video img{width:100px;aspect-ratio:16/9;object-fit:cover;border-radius:7px}.video .meta{flex:1;min-width:180px}.video button{width:auto;padding:9px 12px}.hidden{display:none}
</style></head><body><main><h1>SPICY VAULT Admin</h1>
<p class="status" id="status">Loading Supabase connection…</p>
<section id="auth"><h2>Admin sign in / sign up</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><button class="secondary" id="signup">Create account</button><button class="secondary hidden" id="logout">Logout</button><p class="status" id="userInfo"></p></section>
<section id="editor" class="hidden"><h2>Add or edit video</h2><input id="title" placeholder="Video title"><input id="category" placeholder="Category (Trending/New/Popular)"><input id="poster" placeholder="Poster image URL (optional)"><input id="videoUrl" placeholder="Video URL"><label><input id="published" type="checkbox" style="width:auto"> Published (show in Mini App)</label><button id="save">Save video</button><button class="secondary" id="clear">Clear form</button><input id="editId" type="hidden"></section>
<section id="catalog" class="hidden"><h2>Database videos</h2><div id="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://bqienkfpdwhemomqnorx.supabase.co';
const SUPABASE_KEY='sb_publishable_9qZNVH5FUXW3iPsx2PVQjQ_fealhswM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id); let currentAdmin=false;
function status(t){$('status').textContent=t}
function clearForm(){['title','category','poster','videoUrl','editId'].forEach(x=>$(x).value='');$('published').checked=false}
async function checkAdmin(){
 const {data:{user}}=await sb.auth.getUser(); currentAdmin=false;
 $('logout').classList.toggle('hidden',!user);
 $('userInfo').textContent=user?'Signed in. User UUID: '+user.id+'\nAdmin role must be granted manually in Supabase SQL.':'';
 $('editor').classList.add('hidden');$('catalog').classList.add('hidden');
 if(!user){status('Not signed in.');return}
 const {data,error}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error){status('Database check error: '+error.message+' — run supabase-setup.sql in Supabase SQL Editor first.');return}
 if(!data){status('Login works, but this account is not an admin yet. Copy the UUID shown above and grant admin role in Supabase SQL.');return}
 currentAdmin=true;status('Admin access confirmed.');$('editor').classList.remove('hidden');$('catalog').classList.remove('hidden');await loadVideos()
}
async function loadVideos(){
 const {data,error}=await sb.from('videos').select('*').order('created_at',{ascending:false});
 if(error){$('list').textContent=error.message;return}
 $('list').innerHTML='';
 (data||[]).forEach(v=>{const el=document.createElement('div');el.className='video';const img=document.createElement('img');img.src=v.poster_url||'';img.alt='poster';const meta=document.createElement('div');meta.className='meta';meta.textContent=v.title+' · '+v.category+' · '+(v.published?'Published':'Draft');const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{ $('title').value=v.title;$('category').value=v.category;$('poster').value=v.poster_url||'';$('videoUrl').value=v.video_url;$('published').checked=v.published;$('editId').value=v.id;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='secondary';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this video?'))return;const {error}=await sb.from('videos').delete().eq('id',v.id);if(error)alert(error.message);else loadVideos()};el.append(img,meta,edit,del);$('list').append(el)})
}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)status(error.message);else checkAdmin()};
$('signup').onclick=async()=>{const btn=$('signup');btn.disabled=true;status('Creating account…');try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){status('Email and password—both required.');return}if(password.length<6){status('Password must be at least 6 characters.');return}const {error,data}=await sb.auth.signUp({email,password});if(error){status('Signup failed: '+error.message);return}status(data.user?'Account created. If email confirmation is enabled, check your inbox and confirm, then login.':'Signup request sent. Check your email.')}catch(e){status('Signup error: '+(e?.message||String(e)))}finally{btn.disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();checkAdmin()};
$('save').onclick=async()=>{if(!currentAdmin)return;const payload={title:$('title').value.trim(),category:$('category').value.trim()||'New',poster_url:$('poster').value.trim()||null,video_url:$('videoUrl').value.trim(),published:$('published').checked};if(!payload.title||!payload.video_url){status('Title and video URL are required.');return}let q=$('editId').value?sb.from('videos').update(payload).eq('id',$('editId').value):sb.from('videos').insert(payload);const {error}=await q;if(error)status(error.message);else{status('Saved!');clearForm();loadVideos()}};
$('clear').onclick=clearForm;
sb.auth.onAuthStateChange(()=>setTimeout(checkAdmin,0));
checkAdmin();
</script></body></html>
